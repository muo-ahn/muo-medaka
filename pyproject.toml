[project]
name = "medaka-ontology"
version = "0.1.0"
description = "Evidence-backed ornamental trait ontology for medaka (Oryzias latipes)"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
medaka = "medaka_ontology.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# One-off research build scripts, kept so docs/research/breeder-vocabulary-*
# stays regenerable. They are mostly inline Japanese data tables; reflowing
# them for lint would put the byte-identical regeneration at risk for no gain.
extend-exclude = ["scripts/vocab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as call expressions in argument defaults; that is
# the framework's interface, not the mutable-default bug B008 is aimed at.
"src/medaka_ontology/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
