name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      # Seed YAML parse and cross-check, including the gene-reach rules. No database.
      - run: python -m medaka_ontology.cli validate
      # The graph tests skip when Neo4j is unreachable. Port 1 makes that fail fast
      # instead of waiting on a connection timeout.
      - run: python -m pytest -q
        env:
          NEO4J_URI: bolt://127.0.0.1:1
      # Lint only. `ruff format --check` is not enforced: 21 files predate it.
      - run: ruff check .

  # The graph and pipeline tests need a live server. They skip without one, which is
  # how they drifted from the seed unnoticed. MEDAKA_REQUIRE_NEO4J turns that skip
  # into a failure here, so a service that never came up cannot pass as green.
  integration:
    runs-on: ubuntu-latest
    # Locally the two files take about a minute. The cap is so a hang fails in
    # minutes rather than holding a runner for the six-hour default.
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/medaka-dev-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p medaka-dev-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -rs tests/test_graph_integration.py tests/test_pipeline_integration.py
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_PASSWORD: medaka-dev-password
          MEDAKA_REQUIRE_NEO4J: "1"
