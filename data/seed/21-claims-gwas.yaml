  # ===========================================================================
  # albino -- the broken citation, kept visible rather than dropped
  # ===========================================================================
  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: Gene, name: oca2}
    interpretation: >-
      This pairing has no traceable source. It is recorded at UNKNOWN level, with
      the defect stated, rather than either repeated as fact or silently dropped -
      PRD §5 prefers preserved uncertainty to false confidence, and a reader who
      meets albino->oca2 elsewhere needs to find the reason it failed here.
    review_reasons: [BROKEN_CITATION, EVIDENCE_LEVEL_UNCLEAR]
    evidence:
      - paper: kon2026
        experiment_type: literature attribution
        level: UNKNOWN
        section: Table 1
        finding: >-
          Table 1 lists oca2 as albino's previously reported locus, attributed to
          "Fukamachi et al. 2004". No such paper appears in the article's own
          reference list; the only Fukamachi 2004 entry there is a somatolactin
          study unrelated to oca2. The attribution could not be resolved.
