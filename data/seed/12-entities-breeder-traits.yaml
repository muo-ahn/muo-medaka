# Traits attested only in the trade, not in the literature. PRD §3, §8.
#
# Two of the axes these open were already declared in `TraitCategory` and left
# empty of anything the hobby has produced since 2017. Kon et al. 2026 Table 1
# froze the vocabulary at the strains its 181 fish happened to cover; the hobby did
# not stop there. The third, LUSTER, did not exist until ADR 0008 (2026-10-11): it
# holds 体外光 and its 形質補足 鱗光, both defined by the JMA manual §3.4.2.
#
# NAMES. The sources here are Japanese and print カガミ鱗 and フサヒレ directly,
# while the romanisation is ours: the Japanese is the attested PREFERRED label and
# the romanised `name` is only the identifier, kept for consistency with the rest
# of the graph -- it is not claimed to be anybody's spelling. (Until 2026-09 these
# were the only traits entitled to a Japanese name; the survey in
# docs/research/breeder-vocabulary-2026-09.md extended it to the Kon traits in
# 10-entities-traits.yaml, and ADR 0005 moved all of it to `labels`.)
#
# NAMING HAZARD. `longfin` already exists here as Kon et al.'s "six fins, all but
# the caudal, longer than wild type". The hobby's ロングフィン is a different unit
# of thought and the two must not be merged on the strength of a shared English
# word. PRD §8: a shared name is not evidence of shared biology. Nothing below
# asserts a relation to `longfin`, `hirenaga` or `swallow`.

entities:
  # --- Luster ------------------------------------------------------------------
  - label: OrnamentalTrait
    name: taigaikou
    category: LUSTER
    # bv:0074 (JMA §3.4.2). The category is ADR 0008. NOT miyuki: 幹之 is the
    # 2007 strain nickname (blue body + this trait) and Kon's miyuki also includes
    # melanophore and xanthophore reduction, while JMA says 体外光 now occurs on
    # yellow bodies too (R-36, R-80). No trait-to-trait claim joins the two; they
    # meet only through the shared phenotype `ectopic dorsal iridophore`.
    # Not ヒカリ体型 either: JMA says that fish's dorsal light is ventral
    # iridophores moved dorsally, silver only, reaching no further than the
    # pectoral fin, and is a different trait (see 23-claims-breeder.yaml).
    labels:
      - {text: 体外光, lang: ja, kind: PREFERRED, reading: たいがいこう, sources: [jma5], vocab: [bv:0074]}
      - {text: 체외광, lang: ko, kind: PREFERRED, vocab: [bv:0074]}
    description: >-
      Blue-white light on the back, found in 2007 by 菅高志 and known by the
      strain name 幹之. It normally starts near the dorsal fin and extends toward
      the head; fish whose light reaches the mouth tip are the prized ones. Once
      seen only on blue and white bodies, it is now also bred on yellow bodies.
      JMA reads it as iridophores expressed ectopically on the back, which is why
      it appears on any body shape, with a thick light layer and iridophores on
      the fins as well. The colour of the light varies with the chromatophores
      the fish carries.
    review_reasons: [NEW_ORNAMENTAL_TRAIT, BREEDER_ACADEMIC_LINK]

  - label: OrnamentalTrait
    name: rinkou
    category: LUSTER
    # bv:0087 (JMA §3.4.2). A 形質補足 (光の形) of 体外光, made in 2019 by
    # 垂水政治. 鱗光 is also the name of one of that breeder's strains (with
    # ブロンズ and 王妃, which carry the trait and are called 鱗血統), so the string
    # names a trait and a strain: NAME_COLLISION, the same flag `panda` carries.
    # The survey row has no Korean rendering; 린광 is our reading of the kanji, not
    # a printed term, hence UNVERIFIED and no `vocab`.
    labels:
      - {text: 鱗光, lang: ja, kind: PREFERRED, reading: りんこう, sources: [jma5], vocab: [bv:0087],
         note: "Also the name of a 垂水政治 strain (2019), which carries the trait; the string names both."}
      - {text: 린광, lang: ko, kind: PREFERRED, status: UNVERIFIED,
         note: "Hangul reading of the kanji; no collected source prints a Korean term."}
    description: >-
      体外光 that shows in a scale pattern (鱗目状). Made in 2019 by 垂水政治;
      JMA reports it in that breeder's strains 鱗光, ブロンズ and 王妃. JMA files
      it as a 形質補足 (光の形) of 体外光, so every fish with it also has 体外光.
    review_reasons: [NEW_ORNAMENTAL_TRAIT, BREEDER_ACADEMIC_LINK, UNVERIFIED_LABEL, NAME_COLLISION]

  # --- Scale -------------------------------------------------------------------
  - label: OrnamentalTrait
    name: kagamirin
    category: SCALE
    # AC-6 (spec, 2026-09-29): checked against the JMA 5th ed. manual
    # (01-sources-breeder.yaml, `jma5`) now that it has been read in full.
    # カガミ鱗 does not appear anywhere in it -- no trait section, and no hit in
    # a full-text search of the extracted manual. The CSV survey's own source for
    # this term is piscesbook, not JMA (bv:0256). This trait's evidence stays
    # exactly what it was below: swampcreek_kagamirin and medakayaen_ryuurin.
    labels:
      - {text: カガミ鱗, lang: ja, kind: PREFERRED, sources: [swampcreek_kagamirin, medakayaen_ryuurin], vocab: [bv:0256]}
    description: >-
      Scales markedly larger than wild type, arranged in an orderly lateral row
      and bilaterally symmetric. Named for the mirror scale of carp. Distinct in
      kind from rame and toumeirin, which are about how much a scale reflects;
      this is about how large each scale is and how the scales sit relative to
      one another, and is judged in side view only.
    review_reasons: [NEW_ORNAMENTAL_TRAIT, BREEDER_ACADEMIC_LINK]

  # --- Fin morphology ----------------------------------------------------------
  - label: OrnamentalTrait
    name: fusahire
    category: FIN_MORPHOLOGY
    # The sources print katakana throughout. 房ヒレ is the kanji form the trait is
    # also known by and which gives the romanisation its reading, but no source we
    # hold actually writes it, so it cannot sit beside an attested label.
    labels:
      - {text: フサヒレ, lang: ja, kind: PREFERRED, reading: ふさひれ, sources: [jma5], vocab: [bv:0217]}
      - {text: 房ヒレ, lang: ja, kind: SYNONYM, status: UNVERIFIED, note: "The kanji the trait is also known by; no source we hold writes it."}
      - {text: 후사히레, lang: ko, kind: PREFERRED, vocab: [bv:0217]}
    description: >-
      Elongated dorsal and anal fin rays that branch, with guanine collecting on
      the branches to give a white feathery fringe. A third mode on an axis the
      seed paper resolved into two: hirenaga elongates rays and membrane,
      swallow elongates rays and not membrane, and neither describes a ray that
      divides. The guanine deposition also makes this the one fin trait whose
      expression is partly pigmentary rather than purely morphological.
    review_reasons: [NEW_ORNAMENTAL_TRAIT, BREEDER_ACADEMIC_LINK, UNVERIFIED_LABEL]

  # --- Phenotypes --------------------------------------------------------------
  - label: Phenotype
    name: scale-margin dorsal luster
    description: >-
      Dorsal luster that follows the outlines of individual scales, so that it
      reads as a net or mesh over the scales instead of an unbroken sheet.

  - label: Phenotype
    name: enlarged scale
    description: Individual scales larger in area than wild type.

  - label: Phenotype
    name: fin ray branching
    description: >-
      A fin ray dividing into multiple branches along its length, as distinct
      from simply growing longer.

  - label: Phenotype
    name: guanine deposition on fin rays
    description: >-
      Guanine accumulating on the fin rays, read in the trade as ヒレ光. The
      reflective platelet chemistry is the same one pnp4a serves in the
      iridophore, which is what makes this phenotype worth stating separately
      rather than folding into the fin morphology -- but see
      23-claims-breeder.yaml: no evidence links the two, and the shared word
      "guanine" is not a shared mechanism.

  # --- Anatomy -----------------------------------------------------------------
  # See 11-entities-genomic.yaml for what `query_terms` is for. The coarse `fin`
  # is listed beside the fine name because it is the term that retrieves.
  - label: Anatomy
    name: anal fin
    query_terms: [anal fin, fin]
