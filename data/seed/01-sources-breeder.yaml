# Breeder and hobby-registry sources. PRD §2.4, §8.
#
# WHY THESE ARE :Paper NODES. Evidence hangs off a paper key, and a second
# provenance label would double every read path to buy nothing. What separates a
# trade source from the literature is not the node type, and all three separators
# are already enforced elsewhere:
#
#   1. No DOI, PMID or PMCID. `Paper.id` falls back to `paper:key:<slug>`, and
#      `register_discovered` skips anything it cannot identify by DOI/PMID/PMCID,
#      so a shop page can never be dragged into the acquisition pipeline. Seed
#      ingest never writes `processing_state`, and `papers_in_states` matches on a
#      value, so these are invisible to `pipeline` by construction rather than by
#      anyone remembering to exclude them.
#   2. Every claim resting on them is capped at BREEDER_OBSERVATION -- rank 10,
#      the weakest level above UNKNOWN. Nothing here can outrank a GWAS.
#   3. All of it carries BREEDER_ACADEMIC_LINK into the review queue.
#
# These describe what breeders observe, name and sell. No journal has published on
# either trait below, so this is the whole of the record. Recording it as weak
# evidence is more honest than the silence of leaving it out.
#
# READ, AND CITED (2026-09-29). The JMA (日本メダカ協会) 改良メダカ品種分類マニュアル
# 第五版, September 2025, is the nearest thing this hobby has to a standards body
# and is the anchor source for docs/research/breeder-vocabulary-2026-09.md and
# its two CSVs. It used to sit here only as a comment -- unread, uncited -- on
# the reasoning that citing a classification manual for a classification we
# inferred from shop pages would be exactly the fabricated provenance PRD §2.4
# forbids. It has now actually been read (full text extracted to
# scripts/vocab/raw/jma5.txt, gitignored, third-party text) and is the `jma5`
# paper below. Every `japanese_name` promotion in 10-entities-traits.yaml that
# cites `bv:NNNN (JMA ...)` rests on it, directly or via the CSV survey it
# anchors.

papers:
  - key: jma5
    title: 改良メダカ品種分類マニュアル 第５版
    year: 2025
    journal: 日本メダカ協会 (JMA)
    url: https://jma-medaka.com/wp-content/uploads/2022/08/250901_【公式】品種分類マニュアル_第５版.pdf
    authors: [日本メダカ協会]
    open_access: true
    notes: >-
      Accessed 2026-09-28/29 (docs/research/breeder-vocabulary-2026-09.md). Free
      public PDF, no purchase involved. The closest thing the hobby has to a
      standards body: defines the 形質 (trait) / 形質補足 (trait qualifier) /
      共通補足 (common qualifier) / 珍種 (rare form) taxonomy the trade largely
      follows, and gives per-trait sections (◆由来・概要 origin, ◆特徴 feature,
      ◆形質補足, ◆類似した形質 similar traits) for the traits it covers. It is
      the primary source behind the 2026-09 breeder-vocabulary survey and behind
      most `japanese_name` promotions in 10-entities-traits.yaml and
      12-entities-breeder-traits.yaml.
      WHAT IT DOES NOT SAY. It does not mention カガミ鱗 (kagamirin) anywhere --
      checked by full-text search of the extracted manual, not just its own
      trait index -- so kagamirin rests on piscesbook/note.com alone, as before
      (12-entities-breeder-traits.yaml). It does not use 天眼 for any eye trait
      (10-entities-traits.yaml tenme). Its 共通補足 summary table prints a
      terse "カガミ" cell next to 黄金 with no corresponding §3.8 subsection
      elsewhere in the manual -- almost certainly an unrelated 共通補足 name or
      an extraction artifact of the table's column layout, not a second mention
      of kagamirin; not treated as one.
      WHAT IT DOES SAY, confirmed by direct text search rather than by the CSV
      survey alone: フサヒレ (§3.6.11) is described as elongated fin rays that
      branch partway into a tuft shape (軟条が途中で分岐し房状になる), matching
      the fin ray branching/elongation claims in 23-claims-breeder.yaml; ヒカリ
      (§3.7.1)'s dorsal fin is described as shaped like the ANAL fin, not the
      pelvic fin Kon et al. 2026 Table 1 uses (10-entities-traits.yaml hikari);
      腹膜青 (§3.8.2) is peritoneal iridophore turning blue in a white tank only,
      explicitly distinguished from 腹膜光 (§3.8.3 area), which is the opposite
      condition (black tank only).

  # --- Scale axis --------------------------------------------------------------
  - key: swampcreek_kagamirin
    title: カガミ鱗幹之ってどんなメダカ？大きな鱗が並ぶ不思議な魅力
    journal: note (Swamp & Creek)
    url: https://note.com/noble_takin450/n/n9e755d7ab052
    authors: [Swamp & Creek]
    open_access: true
    notes: >-
      Accessed 2026-09-20. The only descriptive account of the kagamirin
      phenotype we could find: scales larger than normal, in a single orderly
      lateral row, bilaterally symmetric. Explicitly contrasts the trait with
      rame and taigaikou as a matter of scale size and arrangement rather than
      reflective load, and states the arrangement cannot be judged from above.
      A hobby blog, not a reference work.

  - key: horikiri_kagamirin2024
    title: カガミ鱗メダカのメダカ言葉は「夢かなう」
    year: 2024
    journal: 堀切めだか (blog)
    url: https://horikirimedaka.hateblo.jp/entry/2024/07/06/155258
    authors: [堀切めだか]
    open_access: true
    notes: >-
      Accessed 2026-09-20. Origin account only -- carries no morphological
      description, which is why the phenotype claims cite swampcreek_kagamirin
      instead. States the trait was found by Iketani of Nekomanma in 2017 while
      screening stock from the side, brushed up over five years, and reached the
      market in 2024. Uncorroborated single-source history; the dates are the
      shop's own.

  - key: medakayaen_ryuurin
    title: 龍鱗メダカの特徴や作り方、固定率など徹底解説！
    year: 2025
    journal: メダカ屋えん (blog)
    url: https://medakayaen-ec.com/blog/ryuurin/
    authors: [メダカ屋えん]
    open_access: true
    notes: >-
      Accessed 2026-09-20. Describes ryuurin as a house name announced August
      2025 by Mugen Medaka (Okinawa), from Ouroboros x Jabokubu Limone flaming
      type longfin, fixation near 100%, combining full-body kagamirin with rame
      and long fins in pursuit of an Asian arowana scale look. Cited here only
      for the co-occurrence of kagamirin and rame in one strain.

  # --- Fin axis ----------------------------------------------------------------
  - key: medakazukan_mariage2021
    title: マリアージュロングフィン (2021.9) — 最新メダカ紹介
    year: 2021
    journal: 改良メダカWEB図鑑
    url: https://medakazukan.net/202109mariagelongfin/
    authors: [改良メダカWEB図鑑]
    open_access: true
    notes: >-
      Accessed 2026-09-20. The most mechanistic statement of fusahire found
      anywhere: the elongated fin rays branch, and guanine collects on the
      branches, which is what produces the white feathery look. Also the earliest
      dated appearance we can pin -- Tarumi (Ehime), September 2021, from
      rinkou longfin (Tarumi longfin) x morpho. The commonly repeated "fusahire,
      2023" refers to the release of the strain Fromage, not to the trait.

  - key: hinsyuzukan_fusahire
    title: フサヒレ — みんなのメダカ品種図鑑
    journal: みんなのメダカ品種図鑑
    url: https://hinsyu-zukan.satumano-medakayasan.com/tag/%E3%83%95%E3%82%B5%E3%83%92%E3%83%AC/
    authors: [みんなのメダカ品種図鑑]
    open_access: true
    notes: >-
      Accessed 2026-09-20. A house-name index, not a description. Used only to
      establish that fusahire is treated as a fin category in its own right,
      separate from hirenaga, and that it recurs across independent strains:
      Feather Light (2025), Midnight Frill (2023), Fromage (2023), Orange (2024).
