# Trait structure: what each trait is made of, and which traits contain which.
# PRD §3, §4.

claims:
  # --- Subsumption -------------------------------------------------------------
  # The seed paper defines three umbrella classes and runs a separate GWAS on each.
  # Their intervals overlap their members' intervals *by construction*. Without
  # these edges the graph would show kurobuchi and sanshoku independently
  # associating with the same chr14 locus, which reads as replication when it is
  # an artefact of overlapping label sets.
  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: kurobuchi}
    object: {label: OrnamentalTrait, name: sanshoku}
    interpretation: >-
      Shared GWAS signal between these two traits is expected and is not
      independent evidence.
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          kurobuchi is defined as a body colour pattern with black spots, a
          superset that includes sanshoku and kuroaka.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: kurobuchi}
    object: {label: OrnamentalTrait, name: kuroaka}
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          kurobuchi is declared a superset including sanshoku and kuroaka.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: akabuchi}
    object: {label: OrnamentalTrait, name: sanshoku}
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          akabuchi is declared a superset including sanshoku and kouhaku.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: akabuchi}
    object: {label: OrnamentalTrait, name: kouhaku}
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          akabuchi is declared a superset including sanshoku and kouhaku.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: YWKo}
    object: {label: OrnamentalTrait, name: yellow}
    interpretation: >-
      YWKo is an analysis class, not a strain. Its chr12 interval and yellow's
      overlap because the same fish are in both case sets.
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          YWKo is defined as body colour without melanophores, an umbrella class
          covering yellow, white or kouhaku.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: YWKo}
    object: {label: OrnamentalTrait, name: white}
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: YWKo covers yellow, white or kouhaku.

  - predicate: subsumes
    subject: {label: OrnamentalTrait, name: YWKo}
    object: {label: OrnamentalTrait, name: kouhaku}
    evidence:
      - paper: kon2026
        experiment_type: phenotype definition
        level: OBSERVATIONAL
        section: Table 1
        finding: YWKo covers yellow, white or kouhaku.

