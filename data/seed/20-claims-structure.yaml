  # --- Phenotype -> anatomy ----------------------------------------------------
  - predicate: affects_anatomy
    subject: {label: Phenotype, name: dorsal-to-ventral identity transformation}
    object: {label: Anatomy, name: dorsal fin}
    evidence:
      - paper: kon2026
        experiment_type: phenotype description
        level: OBSERVATIONAL
        section: Table 1
        finding: The dorsal fin is shaped like a pelvic fin.

  - predicate: affects_anatomy
    subject: {label: Phenotype, name: dorsal-to-ventral identity transformation}
    object: {label: Anatomy, name: caudal fin}
    evidence:
      - paper: moriyama2012
        experiment_type: skeletal analysis
        level: FUNCTIONAL_VALIDATION
        finding: >-
          zic1/zic4 expression in the dorsal ural mesenchyme drives asymmetric
          caudal fin development; its loss yields a symmetrical, diphycercal-like
          caudal skeleton.

  - predicate: affects_anatomy
    subject: {label: Phenotype, name: shortened body axis}
    object: {label: Anatomy, name: vertebral column}
    evidence:
      - paper: kon2026
        experiment_type: phenotype description
        level: OBSERVATIONAL
        section: Table 1
        finding: Short body axis.

  - predicate: affects_anatomy
    subject: {label: Phenotype, name: iridophore depletion}
    object: {label: Anatomy, name: iris}
    interpretation: >-
      Whether the iris is affected is the discriminator between panda and
      toumeirin, so the anatomy edge is load-bearing here rather than decorative.
    evidence:
      - paper: kon2026
        experiment_type: phenotype description
        level: OBSERVATIONAL
        section: Table 1
        finding: >-
          panda shows decreased iridophore including the iris and peritoneum;
          toumeirin shows the same excluding the iris and peritoneum.

  # The rest of this section is backfill, added so that every phenotype has an
  # anatomical part the search can expand through. Each one reuses the paper, the
  # level and the wording of that phenotype's own `has_phenotype` evidence rather
  # than restating it: the anatomy edge is a second reading of a finding we
  # already hold, not a new observation, and writing a fresh sentence for it would
  # be exactly the PRD §8 failure this file exists to avoid.

