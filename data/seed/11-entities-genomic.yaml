  # --- Variants ----------------------------------------------------------------
  - label: GeneticVariant
    name: adcy5 exon8 56-bp deletion
    variant_type: deletion
    chromosome: "21"
    description: >-
      Homozygous 56-bp deletion spanning the intron7/exon8 boundary of adcy5, found
      in 16 of 18 orochi individuals. The transcript lacks exon 8 with no frameshift
      after exon 9; the deletion maps to the C1b-alpha2 domain.

  - label: GeneticVariant
    name: kitlga frameshift chr6:2485888
    variant_type: frameshift
    chromosome: "6"
    position: 2485888
    description: >-
      Frameshift producing a premature stop; 164-aa truncated protein against a
      233-aa wild type.

  - label: GeneticVariant
    name: zic1/zic4 enhancer transposon insertion
    variant_type: insertion
    chromosome: "20"
    description: >-
      A large transposon inserted into the enhancer region shared by zic1 and zic4,
      causing mesoderm-specific loss of their transcription. The Da lesion.

  - label: GeneticVariant
    name: kcnq5a intron1 deletion
    variant_type: deletion
    chromosome: "15"
    start: 11147312
    end: 11148989
    description: >-
      Hirenaga-specific large deletion in intron 1 of kcnq5a. No hirenaga-specific
      nonsense, frameshift or missense variant was found in the coding region.

  - label: GeneticVariant
    name: bmp5 upstream SNV chr15:24280607
    variant_type: SNV
    chromosome: "15"
    position: 24280607
    description: >-
      SNV 1.6 kb upstream of bmp5; present in 12 of 15 deme cases and 1 of 166
      controls. No deme-specific coding mutation was found.

  - label: GeneticVariant
    name: tyr Tol-1 transposon insertion
    variant_type: insertion
    description: >-
      Insertion of the Tol-1 transposable element into tyrosinase, responsible for
      the classical medaka albino mutation. Somatic excision restores colour.

  # --- Phenotypes --------------------------------------------------------------
  - label: Phenotype
    name: hyper-melanism
    description: Dark body colour from increased melanophore number or dispersion.

  - label: Phenotype
    name: iridophore depletion
    description: Reduced iridophore number or reflective platelet content.

  - label: Phenotype
    name: ectopic dorsal iridophore
    description: Iridophores appearing on the dorsal body surface.

  - label: Phenotype
    name: dorsal-to-ventral identity transformation
    description: >-
      Dorsal structures taking on ventral character, producing mirror-image
      duplication of the ventral half across the lateral midline.

  - label: Phenotype
    name: loss of melanophores
  - label: Phenotype
    name: loss of xanthophores
  - label: Phenotype
    name: fin ray elongation
  - label: Phenotype
    name: fin membrane elongation
  - label: Phenotype
    name: shortened body axis
  - label: Phenotype
    name: eyeball protrusion
    description: Protrusion of the eyeball from the skull without enlargement.
  - label: Phenotype
    name: eyeball enlargement
    description: Enlargement of the eyeball without protrusion.

  # --- Mechanisms --------------------------------------------------------------
  - label: BiologicalMechanism
    name: dorsoventral patterning
  - label: BiologicalMechanism
    name: chromatophore development
  - label: BiologicalMechanism
    name: melanogenesis
  - label: BiologicalMechanism
    name: iridophore development
  - label: BiologicalMechanism
    name: bioelectric fin size regulation
    description: >-
      Potassium-channel-mediated control of fin proportion, established in
      zebrafish.
  - label: BiologicalMechanism
    name: skeletal system development
  - label: BiologicalMechanism
    name: cAMP signaling

