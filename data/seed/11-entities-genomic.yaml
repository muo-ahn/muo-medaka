  - label: Gene
    name: kcnq5a
    species: Oryzias latipes
    symbol: kcnq5a
    chromosome: "15"
    description: >-
      Voltage-gated potassium channel. First medaka potassium-channel candidate for
      fin elongation, by analogy with zebrafish kcnk5b.

  - label: Gene
    name: kcna10
    species: Oryzias latipes
    symbol: kcna10
