    symbol: kcnd3
    chromosome: "7"

  - label: Gene
    name: and2
    species: Oryzias latipes
    symbol: and2
    chromosome: "17"
    description: Actinodin 2; an actinotrichia protein of the fin fold.

  - label: Gene
    name: bmp5
    species: Oryzias latipes
    symbol: bmp5
    chromosome: "15"
    description: Bone morphogenetic protein 5; skeletal system development.

  - label: Gene
    name: abcb6a
    species: Oryzias latipes
    symbol: abcb6a
    chromosome: "2"

  - label: Gene
    name: chn1
    species: Oryzias latipes
    symbol: chn1
    chromosome: "2"

  - label: Gene
    name: tyr
    species: Oryzias latipes
    symbol: tyr
    description: >-
      Tyrosinase, the rate-limiting enzyme of melanin synthesis. The classical
      medaka i locus; also an FST outlier in the seed paper's domestication scan.

  - label: Gene
    name: pnp4a
    species: Oryzias latipes
    symbol: pnp4a
    description: >-
      Purine nucleoside phosphorylase 4a. Causal for the guanineless iridophore
      mutant.

  - label: Gene
    name: sox5
    species: Oryzias latipes
    symbol: sox5
    description: Fate switch between xanthophore and leucophore lineages.

  - label: Gene
    name: wnt4b
    species: Oryzias latipes
    symbol: wnt4b
    chromosome: "16"
    description: >-
      Produced by floor plate cells; required for segmental patterning of the
      vertebral column. Note the chromosome: wnt4b is on chr16, while the daruma
      GWAS peak is on chr4.

  - label: Gene
    name: lmbr1
    species: Oryzias latipes
    symbol: lmbr1
    description: Carries the conserved Shh cis-regulatory module for fin development.

  - label: Gene
    name: mpv17
    species: Oryzias latipes
    symbol: mpv17
    description: >-
      Required for iridophore survival (established in zebrafish transparent).
      Claimed causal for a lab mutant also named panda, in a preprint only.

  - label: Gene
    name: csf1ra
    species: Oryzias latipes
    symbol: csf1ra
    description: Colony stimulating factor 1 receptor a; xanthophore development.

  - label: Gene
    name: oca2
    species: Oryzias latipes
    symbol: oca2
    description: >-
      Listed by the seed paper's Table 1 as albino's reported locus, attributed to
      "Fukamachi et al. 2004" - a paper that does not appear in its own reference
      list. Kept as an entity so the broken attribution stays visible and
      checkable rather than being silently dropped; see the claim carrying
      BROKEN_CITATION. The well-established medaka albino gene is tyr.
    review_reasons: [BROKEN_CITATION]

  # --- Comparative genes. PRD §10 ----------------------------------------------
  # Species is mandatory on Gene precisely so these cannot be read as medaka.
  - label: Gene
    name: kcnk5b
    species: Danio rerio
    symbol: kcnk5b
    description: >-
      Zebrafish two-pore potassium channel; causal for the zebrafish longfin
      mutant. The precedent that motivates potassium-channel candidates in medaka,
      not a medaka finding.

  - label: HumanGene
    name: ADCY5
    symbol: ADCY5
    description: Human adenylate cyclase 5.

  - label: HumanPhenotype
    name: ADCY5-related dyskinesia
    aliases: ["early-onset autosomal dominant chorea and dystonia"]
    description: >-
      Human movement disorder caused by de novo ADCY5 mutations, which cluster in
      the coiled-coil and C1b domains.

