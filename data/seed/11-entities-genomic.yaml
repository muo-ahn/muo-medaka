# Genes, GWAS intervals, variants, phenotypes and mechanisms. PRD §3.
#
# LOCI carry the numbers that say how much weight a hit can bear: case count, best
# P, and how many genes sit inside the interval. The seed paper's intervals hold
# 30-318 genes, and several rest on four to eight mutants, so "candidate gene"
# there generally means "a gene with a plausible GO term inside a multi-megabase
# window". Keeping n and interval width on the node means a dossier cannot quote
# the P-value without also showing what produced it.
#
# Coordinates follow the assembly the seed paper used; recorded as stated.

entities:
  # --- Medaka genes ------------------------------------------------------------
  - label: Gene
    name: adcy5
    species: Oryzias latipes
    symbol: adcy5
    chromosome: "21"
    description: Adenylate cyclase 5. cAMP synthesis.

  - label: Gene
    name: kitlga
    species: Oryzias latipes
    symbol: kitlga
    chromosome: "6"
    description: Kit ligand a. Causal gene for the few melanophore mutant.

  - label: Gene
    name: uvrag
    species: Oryzias latipes
    symbol: uvrag
    chromosome: "14"
    description: UV radiation resistance associated gene; autophagy and melanogenesis.

  - label: Gene
    name: slc45a2
    species: Oryzias latipes
    symbol: slc45a2
    chromosome: "12"
    description: >-
      The classical medaka b locus. Loss reduces melanin content; the himedaka
      (yellow) gene. Human orthologue underlies OCA4.

  - label: Gene
    name: atp6ap2
    species: Oryzias latipes
    symbol: atp6ap2
    chromosome: "21"
    description: >-
      ATPase H+ transporting accessory protein 2; required in melanocyte
      differentiation in zebrafish.

  - label: Gene
    name: foxd3
    species: Oryzias latipes
    symbol: foxd3
    chromosome: "4"
    description: Forkhead box D3; neural crest and pigment cell lineage regulator.

  - label: Gene
    name: slc24a5
    species: Oryzias latipes
    symbol: slc24a5
    chromosome: "3"
    description: >-
      Na+/Ca2+-K+ exchanger. The zebrafish orthologue is golden. Nominated for
      panda by the seed paper, which then hedges the nomination heavily.

  - label: Gene
    name: zic1
    species: Oryzias latipes
    symbol: zic1
    chromosome: "20"
