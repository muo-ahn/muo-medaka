# Prior literature, mechanism links, and the comparative layer.
# PRD §15 Phase 2 (literature backfill), §10 (human ortholog layer).
#
# The laboratory mutants below are linked to breeder traits with
# `putatively_same_as`, never merged into them. PRD §8: until someone shows the
# breeder strain and the lab mutant carry the same genetic background, they stay
# separate entities joined by an evidenced claim.

claims:
  # ===========================================================================
  # albino -- the well-sourced answer the seed paper's broken citation obscures
  # ===========================================================================
  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: Gene, name: tyr}
    interpretation: >-
      This, not oca2, is the documented medaka albino gene. Insertion, somatic
      excision reversion and transgenic rescue all converge, which is about as
      complete as a causal case gets for a classical mutant.
    evidence:
      - paper: koga1995
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          Insertion of a novel transposable element into the tyrosinase gene is
          responsible for an albino mutation in medaka.
      - paper: tsutsumi2006
        experiment_type: somatic reversion analysis
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          Colour reversion of albino medaka is associated with spontaneous somatic
          excision of the Tol-1 element from the tyrosinase gene.

  - predicate: caused_by_variant
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: GeneticVariant, name: tyr Tol-1 transposon insertion}
    evidence:
      - paper: koga1995
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          The Tol-1 transposable element insertion in tyrosinase causes the medaka
          albino mutation.
      - paper: tsutsumi2006
        experiment_type: somatic reversion analysis
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          Excision of the element restores pigmentation, confirming the insertion
          as the lesion.

  # ===========================================================================
  # Laboratory mutants
  # ===========================================================================
  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: guanineless}
    object: {label: Gene, name: pnp4a}
    evidence:
      - paper: kimura2017
        experiment_type: linkage analysis and genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          gu maps 0 cM from a telomeric chromosome 5 marker, and pnp4a was picked
          by synteny with zebrafish, not by narrowing the interval. gu lacks
          pnp4a exons 4-7; a CRISPR 13-bp exon 2 deletion reproduces the
          phenotype and fails to complement gu. The edit is not the gu lesion.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: few melanophore}
    object: {label: Gene, name: kitlga}
    evidence:
      - paper: otsuki2020
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          kit-ligand a is the gene responsible for the medaka pigment cell mutant
          few melanophore. The mutant shows reduced melanophores with no detectable
          alteration in iris iridophores.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: leucophore free}
    object: {label: Gene, name: slc2a15b}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        section: Results
        finding: >-
          The lf locus maps to an 85-kbp interval on chromosome 1; BAC and fosmid
          clones covering slc2a15b rescue the phenotype, a construct with
          slc2a15b exon 1 replaced by GFP does not, and the lf genome carries a
          703-bp deletion removing exons 8 and 9 of slc2a15b.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: leucophore free-2}
    object: {label: Gene, name: pax7a}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        section: Results
        finding: >-
          lf-2 maps to chromosome 5 beside pax7a; a BAC containing pax7a rescues
          the phenotype and one with pax7a exon 1 replaced by GFP does not. A
          1.8-kbp Tol1-arm insertion disrupts pax7a exon 2, and the mutant
          transcript lacks the paired box.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: white leucophore}
    object: {label: Gene, name: slc2a11b}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        section: Results
        finding: >-
          wl maps to a 533-kbp interval on chromosome 9 in which slc2a11b, a
          close relative of slc2a15b, is the candidate. A fosmid carrying
          slc2a11b partially rescues the orange pigmentation of wl leucophores,
          the GFP-disrupted fosmid does not, and wl carries a 2-bp deletion in
          exon 3 that introduces a premature stop.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: many leucophores-3}
    object: {label: Gene, name: sox5}
    evidence:
      - paper: nagao2014
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        section: Results
        finding: >-
          ml-3 maps to a 90-kbp interval on LG23 containing only sox5; the mutant
          skips exon 7, introducing a premature stop. A sox5 morpholino and two
          TILLING alleles reproduce the ml-3 phenotype.
      - paper: nagao2018
        experiment_type: transgenic rescue
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          In sox5 ml-3 homozygotes carrying TgBAC(pax7a:loxp-dsred-loxp-sox5WT),
          Cre-induced wild-type sox5 in the xanthophore/leucophore progenitors
          restored xanthophores and suppressed the excess leucophores (Fig 7).
          The ml-3 form of Sox5, misexpressed the same way, did not alter
          leucophores (S9 Fig).

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: fused centrum}
    object: {label: Gene, name: wnt4b}
    interpretation: >-
      Recorded on fused centrum, where the evidence actually applies. The seed
      paper attaches this citation to daruma instead; keeping the two separate is
      what makes that mis-attribution visible rather than inherited.
    evidence:
      - paper: inohaya2010
        experiment_type: transgenic rescue
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Abstract
        finding: >-
          fsc encodes wnt4b, whose floor-plate expression is lost in the mutant;
          transgenic rescue lines and mosaic analyses establish that production
          of Wnt4b by floor plate cells is essential for segmental patterning of
          the vertebral column.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: panda (pa) lab mutant}
    object: {label: Gene, name: mpv17}
    review_reasons: [FULLTEXT_UNAVAILABLE]
    evidence:
      - paper: koda2024
        experiment_type: positional cloning
        level: UNKNOWN
        finding: >-
          A newly described medaka iridophore mutant named panda (pa) is attributed
          to mpv17. Preprint only, not peer reviewed, so the evidence level is left
          UNKNOWN rather than assigned from the claim's own wording.

  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: Da mutant}
    object: {label: Gene, name: zic1}
    evidence:
      - paper: ohtsuka2004
        experiment_type: positional cloning and morpholino knockdown
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          zic1 and zic4 were identified within the Double anal fin (Da) locus and
          implicated in dorsoventral patterning of the trunk-tail region.
      - paper: moriyama2012
        experiment_type: mutant mapping
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          A large transposon inserted into the zic1/zic4 enhancer causes
          mesoderm-specific loss of their transcription.
      - paper: kawanishi2013
        experiment_type: expression analysis
        level: EXPRESSION_ASSOCIATION
        species: Oryzias latipes
        finding: >-
          Da is an enhancer mutant: zic1/zic4 expression is lost specifically in
          the dorsal half of the somites, establishing them as dorsal-module
          selector genes.

  # ADR 0003 names this claim: ohtsuka2004 narrowed Da to 174 kbp holding zic1
  # and zic4, which is FINE_MAPPING for zic4, but its morpholino targeted zic1
  # only.
  - predicate: associated_with_gene
    subject: {label: OrnamentalTrait, name: Da mutant}
    object: {label: Gene, name: zic4}
    interpretation: >-
      zic4 is inside the cloned Da interval and loses expression in the mutant,
      but no experiment has perturbed zic4 on its own. The lesion sits in an
      enhancer that zic1 and zic4 share, so the data cannot say whether zic4
      contributes to the phenotype or only travels with zic1.
    evidence:
      - paper: ohtsuka2004
        experiment_type: positional cloning
        level: FINE_MAPPING
        species: Oryzias latipes
        finding: >-
          zic1 and zic4 were identified within the Double anal fin (Da) locus, a
          174-kbp interval holding the two genes; the morpholino knockdown that
          partly phenocopied Da targeted zic1 only.
      - paper: moriyama2012
        experiment_type: mutant mapping and expression analysis
        level: EXPRESSION_ASSOCIATION
        species: Oryzias latipes
        finding: >-
          A large transposon inserted into the zic1/zic4 enhancer causes
          mesoderm-specific loss of their transcription.

  - predicate: caused_by_variant
    subject: {label: OrnamentalTrait, name: Da mutant}
    object: {label: GeneticVariant, name: zic1/zic4 enhancer transposon insertion}
    evidence:
      - paper: moriyama2012
        experiment_type: mutant mapping and expression analysis
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          A large transposon inserted into the zic1/zic4 enhancer region causes
          mesoderm-specific loss of their transcription and the diphycercal-like
          caudal skeleton.

  # ===========================================================================
  # Breeder trait <-> laboratory mutant. PRD §8
  # ===========================================================================
  - predicate: putatively_same_as
    subject: {label: OrnamentalTrait, name: hikari}
    object: {label: OrnamentalTrait, name: Da mutant}
    interpretation: >-
      The best-supported breeder/lab identification in the dataset: same locus,
      and an insertion there in every hikari individual genotyped. That it is the
      Da lesion itself was not shown at sequence level (ADR 0004). Still recorded
      as putative rather than merged, because nobody has shown the ornamental
      hikari strains and the laboratory Da line share a genetic background beyond
      this one lesion.
    review_reasons: [BREEDER_ACADEMIC_LINK]
    evidence:
      - paper: kon2026
        experiment_type: variant genotyping
        level: QTL_GWAS_ASSOCIATION
        species: Oryzias latipes
        section: Results
        finding: >-
          The hikari GWAS peak coincides with the zic1/zic4 locus, and the
          insertion known from the Da mutant was confirmed in all 35 hikari
          individuals.

  - predicate: putatively_same_as
    subject: {label: OrnamentalTrait, name: daruma}
    object: {label: OrnamentalTrait, name: fused centrum}
    interpretation: >-
      Phenotypically similar and often conflated, but the genetics do not line up.
      Recorded so the conflation is answerable rather than repeated.
    review_reasons: [BREEDER_ACADEMIC_LINK, CONTRADICTORY_EVIDENCE]
    evidence:
      - paper: kon2026
        experiment_type: literature attribution
        level: UNKNOWN
        section: Table 1
        finding: >-
          The seed paper's Table 1 treats the wnt4b/fused centrum result as
          daruma's reported locus, implying the two are the same thing.
      - paper: kon2026
        experiment_type: variant calling
        level: OBSERVATIONAL
        stance: CONTRADICTS
        section: Results
        finding: >-
          The reported wnt4b mutation was found in at least two daruma individuals
          but does not appear to be the major cause; wnt4b is on chr16 while the
          daruma peak is on chr4.

  - predicate: putatively_same_as
    subject: {label: OrnamentalTrait, name: yellow}
    object: {label: OrnamentalTrait, name: few melanophore}
    interpretation: >-
      Deliberately NOT asserted. Both involve melanophore loss and both sit near
      pigment-cell genes, but they map to different genes (slc45a2 against kitlga).
      The claim exists only to record that the question was asked and answered
      negatively.
    review_reasons: [BREEDER_ACADEMIC_LINK]
    evidence:
      - paper: kon2026
        experiment_type: locus comparison
        level: OBSERVATIONAL
        stance: CONTRADICTS
        finding: >-
          yellow maps to the chr12 slc45a2 region, while few melanophore is caused
          by kitlga on chr6. Shared loss of melanophores does not imply a shared
          genetic basis.

  # ===========================================================================
  # Gene -> mechanism. PRD §4
  # ===========================================================================
  - predicate: participates_in
    subject: {label: Gene, name: adcy5}
    object: {label: BiologicalMechanism, name: cAMP signaling}
    evidence:
      - paper: zhang2022
        experiment_type: comparative functional analysis
        level: OBSERVATIONAL
        species: Danio rerio
        finding: >-
          Adcy3a and Adcy5 are required for melanosome dispersion and melanocyte
          stripe formation in zebrafish.

  - predicate: participates_in
    subject: {label: Gene, name: adcy5}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: kon2026
        experiment_type: genome editing
        level: OBSERVATIONAL
        species: Oryzias latipes
        finding: >-
          Deletion of adcy5 exon 8 increases black body colour in medaka.
          Melanophore development itself was not measured (ADR 0004).

  - predicate: participates_in
    subject: {label: Gene, name: zic1}
    object: {label: BiologicalMechanism, name: dorsoventral patterning}
    evidence:
      - paper: ohtsuka2004
        experiment_type: morpholino knockdown
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Abstract
        finding: >-
          Injecting a zic1 morpholino partly reproduced the early ventralized Da
          phenotypes. zic4 was not knocked down.
      - paper: kawanishi2013
        experiment_type: expression analysis
        level: EXPRESSION_ASSOCIATION
        species: Oryzias latipes
        finding: >-
          zic1/zic4 act as selector genes for the dorsal module of the teleost
          trunk.

  - predicate: participates_in
    subject: {label: Gene, name: zic4}
    object: {label: BiologicalMechanism, name: dorsoventral patterning}
    evidence:
      - paper: ohtsuka2004
        experiment_type: fine mapping and expression analysis
        level: FINE_MAPPING
        species: Oryzias latipes
        finding: >-
          zic1 and zic4 function in dorsoventral patterning of the trunk-tail
          region.

  - predicate: participates_in
    subject: {label: Gene, name: kcnq5a}
    object: {label: BiologicalMechanism, name: bioelectric fin size regulation}
    interpretation: >-
      Inferred from the zebrafish precedent, not demonstrated in medaka. The
      evidence edge below is about kcnk5b; no medaka experiment supports this yet.
    review_reasons: [LOW_RESOLUTION_CONFIDENCE]
    evidence:
      - paper: kon2026
        experiment_type: candidate gene reasoning
        level: UNKNOWN
        section: Discussion
        finding: >-
          kcnq5a is nominated for hirenaga and swallow by analogy with bioelectric
          fin size control; no functional test in medaka is reported.

  - predicate: participates_in
    subject: {label: Gene, name: kcnk5b}
    object: {label: BiologicalMechanism, name: bioelectric fin size regulation}
    evidence:
      - paper: perathoner2014
        experiment_type: positional cloning and transgenic overexpression
        level: FUNCTIONAL_VALIDATION
        species: Danio rerio
        finding: >-
          Gain-of-function kcnk5b mutations cause the zebrafish another longfin
          (alf) mutant and raise K+ conductance; somatic transgenesis shows the
          channel acts locally in fin and barbel mesenchyme to set their size.

  - predicate: participates_in
    subject: {label: Gene, name: slc45a2}
    object: {label: BiologicalMechanism, name: melanogenesis}
    evidence:
      - paper: fukamachi2001
        experiment_type: positional cloning
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: Mutations in slc45a2 reduce melanin content in medaka.

  - predicate: participates_in
    subject: {label: Gene, name: tyr}
    object: {label: BiologicalMechanism, name: melanogenesis}
    evidence:
      - paper: koga1995
        experiment_type: positional cloning
        level: CAUSAL_VARIANT
        species: Oryzias latipes
        finding: >-
          Disruption of tyrosinase, the rate-limiting enzyme of melanin synthesis,
          causes the medaka albino mutation.

  - predicate: participates_in
    subject: {label: Gene, name: oca2}
    object: {label: BiologicalMechanism, name: melanogenesis}
    interpretation: >-
      Wild-type Cab fish edited for imaging, not albino fish, so this says
      nothing about albino -> oca2. The mutant alleles are not described and the
      readout is visual.
    evidence:
      - paper: lischik2019
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          CRISPR oca2 knockout (four sgRNAs) removes the black pigment of the
          eyes and body in F0 embryos and in an established oca2-/- line (Fig 5C,
          S4 Fig, S2 Movie). By visual inspection the loss matches that from a
          tyr knockout. No allele sequence or melanin measurement is reported.

  - predicate: participates_in
    subject: {label: Gene, name: uvrag}
    object: {label: BiologicalMechanism, name: melanogenesis}
    evidence:
      - paper: yang2018
        experiment_type: functional analysis
        level: OBSERVATIONAL
        species: Danio rerio
        finding: >-
          UVRAG is central to autophagy-dependent melanogenesis. Shown outside
          medaka; the medaka uvrag has not been tested.

  - predicate: participates_in
    subject: {label: Gene, name: pnp4a}
    object: {label: BiologicalMechanism, name: iridophore development}
    evidence:
      - paper: kimura2017
        experiment_type: linkage analysis and genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          A pnp4a null edit reproduces the guanineless loss of visible
          iridophores and fails to complement gu.

  - predicate: participates_in
    subject: {label: Gene, name: kitlga}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: otsuki2020
        experiment_type: positional cloning
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          kitlga loss produces the few melanophore pigment cell mutant.

  - predicate: participates_in
    subject: {label: Gene, name: sox5}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: nagao2014
        experiment_type: positional cloning and morpholino knockdown
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          Sox5 switches pigment cell fate between xanthophore and leucophore
          lineages.
      - paper: nagao2018
        experiment_type: transgenic rescue
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          Wild-type sox5 expressed from the pax7a promoter in ml-3 homozygotes
          restores xanthophores and suppresses excess leucophores. In compound
          mutants sox5 loss partly rescues the melanophore and iridophore loss
          of sox10a mutants, but enhances their xanthophore loss and leucophore
          excess: Sox5 antagonises Sox10 in the first two lineages and
          cooperates with it in the last two.
      - paper: nagao2018
        experiment_type: comparative mutant analysis
        level: OBSERVATIONAL
        species: Danio rerio
        section: Results
        finding: >-
          In zebrafish a CRISPR sox5 mutant has normal larval pigment cells and
          more adult xanthophores, and sox5 loss increases xanthophores in
          sox10 mutants. Sox5 represses xanthophores in zebrafish and promotes
          them in medaka: the direction of effect is opposite.

  - predicate: participates_in
    subject: {label: Gene, name: sox10a}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: nagao2018
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          TALEN sox10a alleles (E2del16, E1ins10) reduce melanophores,
          xanthophores, iridophores and trunk leucophores in hatchlings.
          sox10a;sox10b double homozygotes lack all pigment cells except
          leucophores on the dorsal head.

  - predicate: participates_in
    subject: {label: Gene, name: sox10b}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: nagao2018
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          sox10b mutants (TALEN E1del7, TILLING N108S and F110L, reported
          alike) have no overt pigment phenotype alone, but losing one or two
          sox10b copies in sox10a homozygotes progressively removes the
          remaining pigment cells. The phenotype shows only in compounds.

  - predicate: participates_in
    subject: {label: Gene, name: sox9b}
    object: {label: BiologicalMechanism, name: chromatophore development}
    interpretation: >-
      Held at OBSERVATIONAL because only the abstract could be read, and it
      does not say how the sox9b allele was made, so the experiment cannot be
      named for the ceiling. If the full text shows an edited or TILLING allele
      of known sequence, this is FUNCTIONAL_VALIDATION.
    review_reasons: [FULLTEXT_UNAVAILABLE]
    evidence:
      - paper: tsunogai2021
        experiment_type: mutant characterization
        level: OBSERVATIONAL
        species: Oryzias latipes
        section: Abstract
        finding: >-
          sox9b homozygotes form pigment cells normally. sox9b;sox10a double
          mutants lack melanophores and xanthophores and have severely defective
          iridophores, like sox10a;sox10b doubles, and have significantly fewer
          leucophores than sox10a;sox10b doubles.

  - predicate: participates_in
    subject: {label: Gene, name: mitfa}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: miyadai2023
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          A CRISPR mitfa allele (ex6del1) alone leaves pigment cells normal.
          mitfa;mitfb double homozygotes lack melanophores, xanthophores and
          leucophores from embryo to adult, and keep iridophores. The phenotype
          shows only in the double.

  - predicate: participates_in
    subject: {label: Gene, name: mitfb}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: miyadai2023
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          A CRISPR mitfb allele (ex6del7) delays melanophore formation at 2 dpf,
          partly restored by 3 dpf and hatching. With mitfa also lost,
          melanophores, xanthophores and leucophores are absent throughout life;
          iridophores are retained.

  - predicate: participates_in
    subject: {label: Gene, name: pax3b}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: miyadai2023
        experiment_type: genome editing
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        section: Results
        finding: >-
          TALEN pax3b homozygotes (ex2del11) are delayed in forming xanthophores
          and leucophores, which are fewer at hatching and recover as the fish
          grow. gch2, pax7a and mitfa expression in neural crest cells is
          reduced. pax3a homozygotes have no pigment phenotype.

  - predicate: participates_in
    subject: {label: Gene, name: slc2a15b}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          slc2a15b loss produces the leucophore free mutant, which lacks
          leucophores and pigmented xanthophores.

  - predicate: participates_in
    subject: {label: Gene, name: pax7a}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          pax7a is required to form the xanthophore and leucophore precursor
          cells; its loss produces the leucophore free-2 mutant.

  - predicate: participates_in
    subject: {label: Gene, name: slc2a11b}
    object: {label: BiologicalMechanism, name: chromatophore development}
    evidence:
      - paper: kimura2014
        experiment_type: positional cloning
        level: FUNCTIONAL_VALIDATION
        species: Oryzias latipes
        finding: >-
          slc2a11b loss produces the white leucophore mutant, whose leucophores
          fail to become orange and whose xanthophores are unpigmented.

  - predicate: participates_in
    subject: {label: Gene, name: bmp5}
    object: {label: BiologicalMechanism, name: skeletal system development}
    evidence:
      - paper: kon2026
        experiment_type: GO term annotation
        level: UNKNOWN
        section: Results
        finding: >-
          bmp5 was nominated for deme via the GO term skeletal system development
          (GO:0001501). This is an annotation, not a medaka experiment.

  - predicate: participates_in
    subject: {label: Gene, name: and2}
    object: {label: BiologicalMechanism, name: bioelectric fin size regulation}
    interpretation: >-
      A weak edge, kept because it is the only mechanism link the actinodin
      nomination offers. Actinotrichia are structural, so the bioelectric framing
