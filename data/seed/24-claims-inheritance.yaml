  # ---------------------------------------------------------------------------
  # masks -- phenotype-level epistasis, from JMA's own description of what an albino
  # can and cannot show. Both are trade statements (BREEDER_OBSERVATION).
  # ---------------------------------------------------------------------------

  - predicate: masks
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: OrnamentalTrait, name: blue}
    interpretation: >-
      Blue is the colour of melanophores on a fish with no xanthophores (Table
      3: B/b r/r is 'black'); an albino has no melanophores to show. The cross
      query hides blue when albino is expressed.
    evidence:
      - paper: jma5
        experiment_type: breeder description
        level: BREEDER_OBSERVATION
        section: 3.3.1 アルビノ
        finding: >-
          JMA states that albino body colour is limited to white, pink, yellow
          and orange, and never one that contains melanophores such as blue or
          brown.
        quote: "体色は，白系，ピンク系，黄系，オレンジ系（朱赤系）のみに限定され，青系や茶系など黒色素胞の含む体色になることはありません"
      - paper: kon2026
        experiment_type: inference
        level: INFERRED
        species: Oryzias latipes
        finding: >-
          Kon et al. define albino as lack of melanophores throughout the
          body, and blue as colour from melanophores without xanthophores, so
          an albino cannot show blue whatever its r genotype.

  - predicate: masks
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: OrnamentalTrait, name: panda}
    interpretation: >-
      The panda trait is read from the black iris and the eye; an albino has
      none, so the panda genotype is not recognisable and the fish is named
      seethrough instead. The cross query hides panda when albino is
      expressed.
    evidence:
      - paper: jma5
        experiment_type: breeder description
        level: BREEDER_OBSERVATION
        section: 3.8.10 シースルー
        finding: >-
          JMA states that an albino's iris has no melanin, so a fish with
          strongly transparent scales is called seethrough rather than panda.
        quote: "通常，アルビノでは虹彩に黒色素（メラニン）が入らないため強透明鱗の場合，パンダではなくシースルーと呼ばれる。"

  # ---------------------------------------------------------------------------
  # linked_to -- r and the sex-determining gene (stated), and two GWAS intervals on
  # chr21 (inferred). No recombination fraction is recorded for either.
  # ---------------------------------------------------------------------------

  - predicate: linked_to
    subject: {label: Locus, name: r locus}
    object: {label: Gene, name: dmy}
    interpretation: >-
      R on the Y means R travels with dmy: the two are inherited together in
      the paper's strain. No source gives a rate of recombination between r
      and the sex-determining locus, so the cross query assumes none and
      states it (spec 열린 결정).
    evidence:
      - paper: hayasaka2019
        experiment_type: literature attribution
        level: OBSERVATIONAL
        species: Oryzias latipes
        strain: Hd-rRII1
        finding: >-
          dmy / dmrt1bY, the sex-determining gene, is on the Y chromosome, and
          so is the R allele of the r locus in the Hd-rRII1 strain.
        quote: "A sex determining gene named dmy / dmrt1bY ( DM-domain gene on Y chromosome ) has been identified on the Y chromosome"

  - predicate: linked_to
    subject: {label: Locus, name: orochi chr21 interval}
    object: {label: Locus, name: black chr21 interval}
    interpretation: >-
      Physical proximity, not a measured recombination. It is recorded because
      Kon et al. map orochi and black (a darker form of the same colour) to
      neighbouring intervals while calling orochi multilocus; nothing in the
      cross query uses it yet.
    evidence:
      - paper: kon2026
        experiment_type: inference
        level: INFERRED
        species: Oryzias latipes
        finding: >-
          The orochi interval (chr21, 4,494,031-7,110,016) and the black
          interval (chr21, 7,325,809-8,858,152) are on one chromosome, about
          216 kb apart.

  # ---------------------------------------------------------------------------
  # composed_of -- strains JMA names as combinations of traits already in the seed.
  # ---------------------------------------------------------------------------

  - predicate: composed_of
    subject: {label: Strain, name: seethrough}
    object: {label: OrnamentalTrait, name: albino}
    interpretation: >-
      Every part must be present, unlike `subsumes`. In the cross query an
      expressed seethrough absorbs albino and panda: the parts are listed, not
      counted as separate classes.
    evidence:
      - paper: jma5
        experiment_type: breeder description
        level: BREEDER_OBSERVATION
        section: 3.8.10 シースルー
        finding: >-
          JMA describes seethrough as the albino's lack of melanophores
          combined with panda's lack of iridophores in the eye, gills and
          belly, so that the whole body is seen through.
        quote: "アルビノの黒色素胞の欠如，パンダの目，エラ，腹部の虹色素胞の欠如する特徴が合わさり，全体が透けて見えます。"

  - predicate: composed_of
