        quote: "アルビノの黒色素胞の欠如，パンダの目，エラ，腹部の虹色素胞の欠如する特徴が合わさり，全体が透けて見えます。"

  - predicate: composed_of
    subject: {label: Strain, name: Hitomi}
    object: {label: OrnamentalTrait, name: bigeye}
    interpretation: >-
      Neither part has an allele in the seed, so the cross query cannot
      predict Hitomi; the composition is recorded because JMA states it.
    evidence:
      - paper: jma5
        experiment_type: breeder description
        level: BREEDER_OBSERVATION
        section: 3.3.8
        finding: >-
          JMA names Hitomi as the representative strain that fixed suihougan,
          on a big-eye (ビックアイ水泡眼) body.
        quote: "水泡眼を固定化した代表的な品種がビックアイ水泡眼の「Hitomi（ひとみ）」です。"

  - predicate: composed_of
    subject: {label: Strain, name: Hitomi}
    object: {label: OrnamentalTrait, name: suihougan}
