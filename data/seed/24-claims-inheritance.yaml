  - predicate: requires_allele
    subject: {label: OrnamentalTrait, name: albino}
    object: {label: GeneticVariant, name: "i locus: i (albino)"}
    interpretation: >-
      Whether an ornamental albino carries i or another albino locus (oca2) is
      not known; this is the assumption the cross query states.
    evidence:
      - paper: kon2026
        experiment_type: inference
        level: INFERRED
        species: Oryzias latipes
        finding: >-
          Table 1 lists albino as Recessive and the seed identifies the trait
          with the classic i mutant (tyrosinase, koga1995), so the trait is
          the homozygote of the i allele.

  - predicate: requires_allele
    subject: {label: OrnamentalTrait, name: hikari}
    object: {label: GeneticVariant, name: zic1/zic4 enhancer transposon insertion}
    interpretation: >-
      Concordance of the insertion with the trait in 35 fish, with Table 1's
      Recessive for the mode. It is not a cross, and the identity of hikari
      with the laboratory Da mutant remains the putatively_same_as claim, not
      an assertion here.
    evidence:
      - paper: kon2026
        experiment_type: variant genotyping
        level: QTL_GWAS_ASSOCIATION
        species: Oryzias latipes
        section: Results
        finding: >-
          The insertion was confirmed in all 35 hikari individuals.

