    subject: {label: OrnamentalTrait, name: daruma}
    object: {label: GeneticVariant, name: "daruma locus: d"}
    evidence:
      - paper: kon2026
        experiment_type: GWAS
        level: QTL_GWAS_ASSOCIATION
        species: Oryzias latipes
        section: Table 2
        finding: >-
          Association on chromosome 4, 775,070-6,879,644, from 6 daruma
          individuals; best P = 9.61E-38; 211 genes in the interval and no
          candidate gene nominated.

  - predicate: requires_allele
    subject: {label: OrnamentalTrait, name: panda}
    object: {label: GeneticVariant, name: "panda locus: pd"}
    evidence:
